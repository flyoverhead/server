---

# User configuration. `authorized_ssh_keys` names public keys under
# ~/.ssh on the *controller* without the `.pub` suffix -- tasks/user.yml
# appends it.
server_user:
  name: '{{ ansible_user }}'
  group: '{{ ansible_user_gid }}'
  home: '{{ ansible_user_dir }}'
  password: password
  authorized_ssh_keys:
    - id_ed25519

# '*' locks the root account without expiring it. An empty string skips the
# root password task entirely.
server_root_password: '*'

# apt sources
server_apt_mirror: http://mirror.yandex.ru/debian
server_apt_components:
  - main
  - contrib
  - non-free
  - non-free-firmware

# packages
server_packages:
  - acl
  - apparmor
  - ca-certificates
  - libffi-dev
  - libssl-dev
  - git
  - needrestart
  - python3
  - python3-dev
  - python3-venv
  - python3-pip
  - python3-requests

# pip virtual environment path
server_pip_pyenv_path: '{{ ansible_user_dir }}/.venv'

# pip packages
server_pip_packages:
  - pip

server_timezone: Europe/Moscow

server_upgrade: false
