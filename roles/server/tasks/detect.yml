---

- name: detect | gather remote facts
  ansible.builtin.setup:

- name: detect | ssh port
  when:
    - ansible_port != 22
  block:

    - name: detect | custom ssh port fact
      ansible.builtin.set_fact:
        server_ssh_port: '{{ ansible_port }}'
        server_ssh_host: '{{ ansible_host }}'

    - name: detect | default ssh port
      ansible.builtin.wait_for:
        port: 22
        state: started
        host: '{{ server_ssh_host }}'
        connect_timeout: 5
        timeout: 10
      register: server_default_ssh_port
      check_mode: false
      failed_when:
        - '"Timeout when waiting" not in (server_default_ssh_port.msg | default(""))'
        - server_default_ssh_port.failed | default(false)

    - name: detect | default ssh port fact  # noqa: var-naming[no-role-prefix]
      ansible.builtin.set_fact:
        ansible_port: 22
      when:
        - '"Timeout when waiting" not in server_default_ssh_port.msg'

- name: detect | connection to host
  ansible.builtin.ping:
  register: server_check_connection_result
  failed_when:
    - '"Connection refused" not in (server_check_connection_result.msg | default(""))'
    - '"Permission denied" not in (server_check_connection_result.msg | default(""))'
    - '"pong" not in (server_check_connection_result.ping | default(""))'

- name: detect | set server_apt_sources fact
  ansible.builtin.set_fact:
    server_apt_sources: >-
      {{ lookup('community.general.merge_variables',
      '^server_.+_apt_sources$',
      initial_value=[]) }}

- name: detect | assert apt sources were merged
  ansible.builtin.assert:
    that:
      - server_apt_sources | length > 0
    fail_msg: >-
      server_apt_sources merged to an empty list. Every apt source variable
      must match ^server_.+_apt_sources$ to be picked up by
      community.general.merge_variables -- check the name of whatever
      replaced server_default_apt_sources.
    quiet: true

- name: detect | assert required apt source keys
  ansible.builtin.assert:
    that:
      - server_apt_sources | rejectattr('name', 'defined') | list | length == 0
      - server_apt_sources | rejectattr('uris', 'defined') | list | length == 0
      - server_apt_sources | rejectattr('suites', 'defined') | list | length == 0
      - server_apt_sources | rejectattr('components', 'defined') | list | length == 0
    fail_msg: >-
      Every merged apt source entry needs name, uris, suites and components;
      offending entries: {{ (server_apt_sources | rejectattr('name', 'defined') | list) +
      (server_apt_sources | rejectattr('uris', 'defined') | list) +
      (server_apt_sources | rejectattr('suites', 'defined') | list) +
      (server_apt_sources | rejectattr('components', 'defined') | list) }}
    quiet: true

- name: detect | assert unique apt source names
  ansible.builtin.assert:
    that:
      - server_apt_sources | map(attribute='name') | list ==
        server_apt_sources | map(attribute='name') | unique | list
    fail_msg: >-
      Two merged apt source entries share a name and would write the same
      file: {{ server_apt_sources | map(attribute='name') | list }}
    quiet: true
