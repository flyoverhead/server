---

- name: packages | install required
  become: true
  ansible.builtin.apt:
    name: '{{ server_packages }}'
    state: present
    update_cache: true
    cache_valid_time: 3600
  tags:
    - server.packages

- name: packages | create virtualenv
  ansible.builtin.command:
    cmd: >-
      {{ server_uv_bin }} venv
      --python python3
      --no-python-downloads
      {{ server_pip_pyenv_path }}
    creates: '{{ server_pip_pyenv_path }}/bin/python'
  tags:
    - server.pip

- name: packages | install pip packages
  when:
    - server_pip_packages | length > 0
  ansible.builtin.command:
    cmd: >-
      {{ server_uv_bin }} pip install --upgrade
      --python {{ server_pip_pyenv_path }}/bin/python
      {{ server_pip_packages | join(' ') }}
  environment:
    NO_COLOR: '1'
  register: server_uv_pip
  changed_when: "'Installed' in server_uv_pip.stderr"
  tags:
    - server.pip

- name: packages | upgrade
  become: true
  when:
    - server_upgrade
  tags:
    - server.upgrade
  block:

    - name: packages | check updates
      ansible.builtin.apt:
        cache_valid_time: 3600
        update_cache: True

    - name: packages | upgrade
      ansible.builtin.apt:
        upgrade: safe
        update_cache: True
      environment:
        DEBIAN_FRONTEND: noninteractive

    - name: packages | clean dependencies
      ansible.builtin.apt:
        autoremove: True

    # batch mode skips the notify.d hooks, whose SIGPIPE killed the interactive run (rc -13)
    - name: packages | check pending restarts
      ansible.builtin.command:
        cmd: needrestart -b -r l
      register: server_needrestart
      check_mode: false
      changed_when: >-
        server_needrestart.stdout is search('^NEEDRESTART-KSTA: [23]$', multiline=true)
        or server_needrestart.stdout is search('^NEEDRESTART-SVC: ', multiline=true)
      notify:
        - packages | reboot
