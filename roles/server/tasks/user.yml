---

- name: user | set default ansible user  # noqa: var-naming[no-role-prefix]
  ansible.builtin.set_fact:
    ansible_user: '{{ default_user }}'
    ansible_password: '{{ default_password }}'
  when:
    - '"Permission denied" in (server_check_connection_result.msg | default(""))'

- name: user | gather missing facts
  ansible.builtin.setup:
  when:
    - ansible_facts.distribution_release is not defined

- name: user | group
  become: true
  ansible.builtin.group:
    name: '{{ server_user.group }}'
    state: present

- name: user | create
  become: true
  ansible.builtin.user:
    name: '{{ server_user.name }}'
    password: '{{ "%s" | format(server_user.password) | password_hash("sha512") }}'
    group: '{{ server_user.group }}'
    create_home: true
    state: present

- name: user | apt sources list
  become: true
  ansible.builtin.template:
    src: sources.list.j2
    dest: /etc/apt/sources.list
    owner: root
    group: root
    mode: '0644'

- name: user | install sudo
  become: true
  ansible.builtin.apt:
    name: sudo
    state: present
    update_cache: true

- name: user | sudo rights
  become: true
  ansible.builtin.template:
    src: sudo_user.j2
    dest: /etc/sudoers.d/{{ server_user.name }}
    owner: root
    group: root
    mode: '0440'
    lstrip_blocks: true
    validate: visudo -cf %s

- name: user | remote_tmp
  become: true
  ansible.builtin.file:
    path: /home/{{ server_user.name }}/.ansible/tmp
    state: directory
    owner: '{{ server_user.name }}'
    group: '{{ server_user.group }}'
    mode: '0755'

- name: user | authorized keys
  become: true
  ansible.posix.authorized_key:
    user: '{{ server_user.name }}'
    key: "{{ lookup('file', lookup('env', 'HOME') + '/.ssh/' + item + '.pub') }}"
  loop: '{{ server_user.authorized_ssh_keys }}'

- name: user | set fact  # noqa: var-naming[no-role-prefix]
  ansible.builtin.set_fact:
    ansible_user: '{{ server_user.name }}'
    ansible_password: '{{ server_user.password }}'
  notify:
    - user | reconnect

- name: user | gather facts
  ansible.builtin.setup:
