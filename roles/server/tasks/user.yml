---

- name: user | set default ansible user  # noqa: var-naming[no-role-prefix]
  ansible.builtin.set_fact:
    ansible_user: '{{ default_user }}'
    ansible_password: '{{ default_password }}'
  when:
    - '"Permission denied" in (server_check_connection_result.msg | default(""))'

- name: user | gather missing facts
  ansible.builtin.setup:
  when:
    - ansible_facts.distribution_release is not defined

- name: user | set server_apt_sources fact
  ansible.builtin.set_fact:
    server_apt_sources: >-
      {{ lookup('community.general.merge_variables',
      '^server_.+_apt_sources$',
      initial_value=[]) }}

- name: user | assert apt sources were merged
  ansible.builtin.assert:
    that:
      - server_apt_sources | length > 0
    fail_msg: >-
      server_apt_sources merged to an empty list. Every apt source variable
      must match ^server_.+_apt_sources$ to be picked up by
      community.general.merge_variables -- check the name of whatever
      replaced server_default_apt_sources.
    quiet: true

- name: user | assert required apt source keys
  ansible.builtin.assert:
    that:
      - server_apt_sources | rejectattr('name', 'defined') | list | length == 0
      - server_apt_sources | rejectattr('uris', 'defined') | list | length == 0
      - server_apt_sources | rejectattr('suites', 'defined') | list | length == 0
      - server_apt_sources | rejectattr('components', 'defined') | list | length == 0
    fail_msg: >-
      Every merged apt source entry needs name, uris, suites and components;
      offending entries: {{ (server_apt_sources | rejectattr('name', 'defined') | list) +
      (server_apt_sources | rejectattr('uris', 'defined') | list) +
      (server_apt_sources | rejectattr('suites', 'defined') | list) +
      (server_apt_sources | rejectattr('components', 'defined') | list) }}
    quiet: true

- name: user | assert unique apt source names
  ansible.builtin.assert:
    that:
      - server_apt_sources | map(attribute='name') | list ==
        server_apt_sources | map(attribute='name') | unique | list
    fail_msg: >-
      Two merged apt source entries share a name and would write the same
      file: {{ server_apt_sources | map(attribute='name') | list }}
    quiet: true

- name: user | group
  become: true
  ansible.builtin.group:
    name: '{{ server_user.group }}'
    state: present

- name: user | create
  become: true
  ansible.builtin.user:
    name: '{{ server_user.name }}'
    password: '{{ "%s" | format(server_user.password) | password_hash("sha512") }}'
    group: '{{ server_user.group }}'
    create_home: true
    state: present

- name: user | suppress apt sources list
  become: true
  ansible.builtin.copy:
    dest: /etc/apt/sources.list
    content: |
      #
      # Ansible managed
      #

      # DO NOT EDIT HERE
      # apt sources now live as drop-ins under /etc/apt/sources.list.d
    owner: root
    group: root
    mode: '0644'

- name: user | check apt sources to disable
  become: true
  ansible.builtin.stat:
    path: /etc/apt/sources.list.d/{{ item }}
  register: server_apt_disable_stat
  loop: >-
    {{ server_apt_disable_sources | difference(server_apt_sources |
    map(attribute='name') | map('regex_replace', '$', '.sources') | list) }}

- name: user | preserve apt sources to disable
  become: true
  ansible.builtin.copy:
    src: '{{ item.stat.path }}'
    dest: '{{ item.stat.path }}.disabled'
    remote_src: true
    mode: preserve
  loop: '{{ server_apt_disable_stat.results }}'
  loop_control:
    label: '{{ item.item }}'
  when:
    - item.stat.exists

- name: user | disable apt sources
  become: true
  ansible.builtin.file:
    path: '{{ item.stat.path }}'
    state: absent
  loop: '{{ server_apt_disable_stat.results }}'
  loop_control:
    label: '{{ item.item }}'
  when:
    - item.stat.exists

- name: user | apt sources
  become: true
  ansible.builtin.template:
    src: apt.sources.j2
    dest: /etc/apt/sources.list.d/{{ item.name }}.sources
    owner: root
    group: root
    mode: '0644'
    backup: true
  loop: '{{ server_apt_sources }}'
  loop_control:
    label: '{{ item.name }}'

- name: user | install sudo
  become: true
  ansible.builtin.apt:
    name: sudo
    state: present
    update_cache: true

- name: user | sudo rights
  become: true
  ansible.builtin.template:
    src: sudo_user.j2
    dest: /etc/sudoers.d/{{ server_user.name }}
    owner: root
    group: root
    mode: '0440'
    lstrip_blocks: true
    validate: visudo -cf %s

- name: user | remote_tmp
  become: true
  ansible.builtin.file:
    path: /home/{{ server_user.name }}/.ansible/tmp
    state: directory
    owner: '{{ server_user.name }}'
    group: '{{ server_user.group }}'
    mode: '0755'

- name: user | authorized keys
  become: true
  ansible.posix.authorized_key:
    user: '{{ server_user.name }}'
    key: "{{ lookup('file', lookup('env', 'HOME') + '/.ssh/' + item + '.pub') }}"
  loop: '{{ server_user.authorized_ssh_keys }}'

- name: user | set fact  # noqa: var-naming[no-role-prefix]
  ansible.builtin.set_fact:
    ansible_user: '{{ server_user.name }}'
    ansible_password: '{{ server_user.password }}'
  notify:
    - user | reconnect

- name: user | gather facts
  ansible.builtin.setup:
