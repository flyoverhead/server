---

- name: uv | check installed version
  ansible.builtin.command:
    cmd: uv --version
  register: server_uv_installed
  changed_when: false
  failed_when: false
  check_mode: false
  tags:
    - server.uv

- name: uv | install
  become: true
  when:
    - server_uv_version not in (server_uv_installed.stdout | default(''))
  ansible.builtin.unarchive:
    src: '{{ server_uv_url }}'
    dest: /usr/local/bin
    remote_src: true
    extra_opts:
      - --strip-components=1
      - --wildcards
      - '*/uv'
      - '*/uvx'
    owner: root
    group: root
    mode: '0755'
  tags:
    - server.uv
