---

# Firewalld rules. Every variable matching `^systemd.+firewalld$` is merged
# into one list by the `community.general.merge_variables` lookup in
# tasks/detect.yml, so a caller can add rules in a group_vars file under its
# own name (`systemd_extra_firewalld`, `systemd_web_firewalld`, ...) instead of
# having to restate this list.
systemd_default_firewalld:
  - name: ssh
    port: '{{ ansible_port }}/tcp'
    zone: public
    state: enabled
    permanent: true

# Networkd interfaces. An empty list disables all networkd management: no
# .link/.netdev/.network file is written and /etc/network/interfaces is left
# alone. As soon as the list is non-empty the role takes over networking
# completely -- it removes every file under /etc/systemd/network it did not
# just write, and masks the legacy `networking` service.
#
# `kind` selects the template and the file-name priority prefix:
#
#   ether, link, loopback -> 10    bridge, bond -> 20    vlan -> 30    ipip -> 40
#
# The interface carrying the default route is appended automatically if the
# list does not already mention it.
systemd_networkd: []

