---

- name: install | dependencies
  become: True
  ansible.builtin.apt:
    name: '{{ ohmyzsh_dependencies }}'
    state: present
    update_cache: True
    cache_valid_time: 3600
  when:
    - ansible_facts.system == 'Linux'

- name: install | clear previous oh-my-zsh install
  ansible.builtin.file:
    path: '{{ ohmyzsh_user_home }}/.oh-my-zsh'
    state: absent
  when:
    - ohmyzsh_force_reinstall

- name: install | download oh-my-zsh install script
  become: True
  become_user: '{{ ohmyzsh_user_name }}'
  ansible.builtin.get_url:
    url: https://raw.githubusercontent.com/ohmyzsh/ohmyzsh/master/tools/install.sh
    dest: /tmp/ohmyzsh-install.sh
    mode: '0755'
  when:
    - not ohmyzsh_installed or ohmyzsh_force_reinstall

- name: install | oh-my-zsh
  become: True
  become_user: '{{ ohmyzsh_user_name }}'
  ansible.builtin.command:
    cmd: sh /tmp/ohmyzsh-install.sh --unattended
    creates: '{{ ohmyzsh_user_home }}/.oh-my-zsh'

- name: install | remove install script
  become: True
  become_user: '{{ ohmyzsh_user_name }}'
  ansible.builtin.file:
    path: /tmp/ohmyzsh-install.sh
    state: absent
  when:
    - not ohmyzsh_installed or ohmyzsh_force_reinstall

- name: install | set default zsh shell
  become: True
  ansible.builtin.user:
    name: '{{ ohmyzsh_user_name }}'
    shell: /bin/zsh
